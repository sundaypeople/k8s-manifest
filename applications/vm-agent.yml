apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: vm-agent
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/sundaypeople/k8s-manifest
    targetRevision: HEAD
    path: vmagent/
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: target-namespace
  syncPolicy:
    automated:
      enabled: true
