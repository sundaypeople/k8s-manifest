apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: knative-serving
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/sundaypeople/k8s-manifest
    targetRevision: HEAD
    path: knative-serving/
  destination:
    server: 'https://kubernetes.default.svc'
  syncPolicy:
    automated:
      enabled: true
    syncOptions:
      - ServerSideApply=true
